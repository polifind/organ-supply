<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send us a note | Organ Abundance</title>
  <meta name="description" content="Send a note to the people working on organ abundance.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/f48.png?v=2">
  <link rel="icon" type="image/png" sizes="96x96" href="/f96.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/f192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: white;
      color: #111;
      font-family: 'EB Garamond', 'Georgia', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---- Hero ---- */
    .hero {
      min-height: 100vh;
      min-height: 100svh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .wordmark {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
    }
    .wordmark img {
      display: block;
      height: 24px;
      width: auto;
    }
    .hero-statement {
      font-size: 19px;
      line-height: 1.5;
      color: #333;
    }
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .hero-image {
      width: 55%;
      max-width: 280px;
    }
    .hero-image img {
      width: 100%;
      height: auto;
      display: block;
    }
    .scroll-hint {
      text-align: center;
      margin-top: 2rem;
      padding: 0.5rem 0;
    }
    .scroll-hint a {
      font-size: 16px;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.05em;
      font-style: italic;
      transition: color 0.2s;
      display: inline-block;
      padding: 0.5rem 1rem;
      min-height: 44px;
      line-height: 44px;
    }
    .scroll-hint a:hover { color: #555; }
    .scroll-hint .arrow {
      display: block;
      font-size: 18px;
      color: #ccc;
      animation: nudge 2s ease-in-out infinite;
    }
    @keyframes nudge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* ---- Essay ---- */
    .essay {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    .essay-rule {
      width: 100%;
      border: none;
      border-top: 1px solid #ccc;
      margin-bottom: 1.5rem;
    }
    .essay-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .essay-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.18;
      margin-bottom: 0.4rem;
    }
    .essay-subtitle {
      font-size: 16px;
      font-weight: 500;
      color: #555;
      margin-bottom: 0.8rem;
    }
    .essay-body {
      columns: 1;
    }
    .essay-body p {
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 1rem;
      text-align: left;
      hyphens: none;
      -webkit-hyphens: none;
      break-inside: avoid;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    .essay-body .lead {
      font-weight: 500;
    }
    .essay-body .pivot {
      font-weight: 600;
    }
    .essay-body .pullquote {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.42;
      color: #111;
      border-left: 3px solid #111;
      padding: 0.15rem 0 0.15rem 0.85rem;
      margin: 1.5rem 0;
    }
    .essay-body h2 {
      font-size: 24px;
      font-weight: 700;
      font-variant: small-caps;
      letter-spacing: 0.05em;
      margin-top: 2.2rem;
      margin-bottom: 0.7rem;
      break-after: avoid;
    }

    .essay-body .fig {
      margin: 1.8rem 0 1.6rem;
    }
    .essay-body .fig img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      mix-blend-mode: multiply;
    }
    .essay-body .fig .wide { display: none; }
    .essay-body .fig .tall { display: block; }
    @media (min-width: 768px) {
      .essay-body .fig { margin: 2.4rem 0 2rem; }
      .essay-body .fig .wide { display: block; }
      .essay-body .fig .tall { display: none; }
    }
    .essay-body, .essay-body p, .essay-body .pullquote, .essay-body h2 {
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    html, body { overflow-x: hidden; }
    .essay-body .fig figcaption {
      margin-top: 0.7rem;
      font-size: 0.8em;
      font-style: italic;
      line-height: 1.5;
      color: #6b6560;
    }
    .essay-body .closing {
      font-weight: 500;
      border-top: 1px solid #ddd;
      padding-top: 0.8rem;
      margin-top: 0.4rem;
    }
    .essay-body a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .essay-body a:hover { color: #555; }

    /* ---- Share row ---- */
    .share-row {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .share-btn {
     font-family: 'EB Garamond', 'Georgia', serif;
     font-size: 17px;
     font-style: italic;
     color: #999;
     background: none;
     border: none;
     cursor: pointer;
     padding: 0;
     line-height: 1;
     transition: color 0.2s;
     text-decoration: none;
     display: inline-flex;
     align-items: center;
    }
    .share-btn:hover { color: #555; }

    /* ---- Responsive ---- */
    @media (min-width: 375px) {
      .hero-statement { font-size: 20px; }
      .hero-image { width: 60%; max-width: 300px; }
      .essay-title { font-size: 28px; }
      .essay-body p { font-size: 19px; }
      
      .essay-body .pullquote { font-size: 21px; }
    }
    @media (min-width: 481px) {
      .hero { padding: 3rem 1.5rem; }
      .wordmark { top: 1.5rem; left: 1.5rem; }
      .wordmark img { height: 28px; }
      .hero-statement { font-size: 22px; }
      .hero-content { gap: 2rem; }
      .hero-image { width: 55%; max-width: 320px; }
      .scroll-hint a { font-size: 17px; }
      .essay { padding: 2rem 1.5rem 3rem; }
      .essay-rule { margin-bottom: 2rem; }
      .essay-header { margin-bottom: 2rem; }
      .essay-title { font-size: 30px; }
      .essay-subtitle { font-size: 18px; }
      .essay-body p { font-size: 20px; line-height: 1.7; margin-bottom: 1.2rem; }
      
      .essay-body .pullquote { font-size: 23px; margin: 1.8rem 0; padding: 0.3rem 0 0.3rem 1.2rem; }
      .essay-body h2 { font-size: 28px; margin-top: 2.8rem; margin-bottom: 0.9rem; }
    .essay-body .closing { padding-top: 1rem; margin-top: 0.5rem; }
    }
    @media (min-width: 768px) {
      .hero { padding: 3rem 2.5rem; }
      .wordmark { top: 2rem; left: 2rem; }
      .wordmark img { height: 31px; }
      .hero-statement { font-size: 26px; }
      .hero-content { flex-direction: row; align-items: center; gap: 3rem; }
      .hero-image { flex: 0 0 38%; width: auto; max-width: none; }
      .hero-statement { flex: 1 1 auto; min-width: 0; }
      .scroll-hint { margin-top: 3rem; }
      .essay { max-width: 720px; padding: 3rem 2.5rem 4rem; }
      .essay-rule { margin-bottom: 2.5rem; }
      .essay-header { margin-bottom: 2.5rem; }
      .essay-title { font-size: 34px; margin-bottom: 0.5rem; }
      .essay-subtitle { font-size: 20px; }
      .essay-body p { font-size: 21px; line-height: 1.65; }
      
      .essay-body .pullquote { font-size: 25px; }
      .essay-body h2 { font-size: 30px; margin-top: 3.2rem; }
    }
    @media (min-width: 1024px) {
      .hero { padding: 3rem 2rem; }
      .wordmark img { height: 34px; }
      .hero-statement { font-size: 28px; }
      .hero-content { gap: 4rem; }
      .hero-image { flex: 0 0 42%; }
      .scroll-hint { margin-top: 4rem; }
      .scroll-hint a { font-size: 18px; }
      .essay { max-width: 740px; padding: 4rem 2.5rem 5rem; }
      .essay-rule { margin-bottom: 3rem; }
      .essay-header { margin-bottom: 3rem; }
      .essay-title { font-size: 38px; margin-bottom: 0.6rem; }
      .essay-body .pullquote { font-size: 26px; }
    }
    /* ---- Hamburger + overlay nav ---- */
    .nav-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 200;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .nav-toggle span {
      display: block;
      width: 24px;
      height: 1.5px;
      background: #111;
      transition: transform 0.3s ease, opacity 0.2s ease;
      transform-origin: center;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .nav-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4.5rem 1.5rem 3rem;
    }
    .nav-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-overlay-list {
      list-style: none;
      padding: 0;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.5rem, 1.6vh, 1.1rem);
    }
    .nav-overlay-list a {
      font-family: 'EB Garamond', 'Georgia', serif;
      font-size: clamp(17px, 2.7vh, 25px);
      line-height: 1.25;
      color: #111;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-overlay-list a:hover { color: #555; }
    @media (min-width: 481px) {
      .nav-toggle { top: 1.5rem; right: 1.5rem; }
      .nav-overlay-list { gap: clamp(0.55rem, 1.8vh, 1.3rem); }
      .nav-overlay-list a { font-size: clamp(18px, 3vh, 29px); }
    }
    @media (min-width: 768px) {
      .nav-toggle { top: 2rem; right: 2rem; }
      .nav-overlay-list { gap: clamp(0.6rem, 2vh, 1.5rem); }
      .nav-overlay-list a { font-size: clamp(20px, 3.4vh, 34px); }
    }

    /* ---- Sidebar TOC ---- */
    .toc {
      display: none;
    }
    @media (min-width: 1160px) {
      .toc {
        display: block;
        position: fixed;
        left: max(1.25rem, calc((100vw - 680px) / 2 - 13.5rem));
        max-width: 11rem;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .toc.visible { opacity: 1; }
      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid #ddd;
      }
      .toc-item {
        padding: 0.35rem 0 0.35rem 1rem;
      }
      .toc-item a {
        font-family: 'EB Garamond', 'Georgia', serif;
        font-size: 14px;
        color: #bbb;
        text-decoration: none;
        letter-spacing: 0.02em;
        transition: color 0.2s;
      }
      .toc-item a:hover { color: #555; }
      .toc-item.active {
        border-left: 2px solid #111;
        margin-left: -1px;
      }
      .toc-item.active a {
        color: #111;
        font-weight: 600;
      }
    }
  
    .wordmark {
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #444;
      font-weight: 600;
    }
    @media (min-width: 768px) { .wordmark { font-size: 17px; } }
    .essay-body .byline {
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #777;
      font-weight: 500;
    }
    .hero-image img { mix-blend-mode: multiply; }
    .essay-footer {
      margin-top: 2rem;
      font-style: italic;
      color: #777;
      font-size: 17px;
      text-align: center;
    }

    .essay-body a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(17,17,17,0.28);
      padding-bottom: 0.5px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .essay-body a:hover {
      color: #000;
      border-bottom-color: rgba(17,17,17,0.75);
    }
    .essay-body .pullquote a {
      border-bottom-width: 1px;
      border-bottom-color: rgba(17,17,17,0.22);
    }

    /* ---- Note form ---- */
    .form-page { max-width: 560px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .form-page h1 {
      font-family: 'EB Garamond', 'Georgia', serif;
      font-size: 30px; font-weight: 700; line-height: 1.18; margin: 0 0 0.5rem;
    }
    .form-page .sub { font-size: 18px; color: #555; margin: 0 0 2.2rem; line-height: 1.6; }
    .field { margin-bottom: 1.4rem; }
    .field label {
      display: block; font-family: 'EB Garamond', 'Georgia', serif;
      font-size: 15px; font-variant: small-caps; letter-spacing: 0.06em;
      color: #6b6560; margin-bottom: 0.4rem;
    }
    .field .req { color: #b5651d; }
    .field input, .field textarea {
      width: 100%; box-sizing: border-box;
      font-family: 'EB Garamond', 'Georgia', serif; font-size: 18px; line-height: 1.5;
      color: #111; background: #fffdfa;
      border: 1px solid #ddd8d0; border-radius: 2px;
      padding: 0.6rem 0.7rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,0.06);
    }
    .field textarea { min-height: 170px; resize: vertical; }
    .form-actions { margin-top: 2rem; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
    .btn {
      font-family: 'EB Garamond', 'Georgia', serif; font-size: 18px;
      background: #111; color: #fcfaf6; border: 1px solid #111;
      padding: 0.6rem 1.6rem; border-radius: 2px; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: #fcfaf6; color: #111; }
    .back-link {
      display: inline-block; margin-top: 2.5rem; padding-top: 1.5rem;
      border-top: 1px solid #ddd; font-size: 16px;
      color: #6b6560; text-decoration: none;
    }
    .back-link:hover { color: #111; }
    .hp { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
    @media (min-width: 481px) {
      .form-page h1 { font-size: 34px; }
      .form-page { padding: 5rem 1.5rem 4rem; }
    }
</style>
</head>
<body>

<div class="wordmark">Organ Abundance</div>

<div class="form-page">
  <h1>Send us a note</h1>
  <p class="sub">Scientists, clinicians, engineers, investors, patients, or anyone who wants to help.
  Tell us who you are and what you are thinking about.</p>

  <form action="https://formsubmit.co/rohan.pavuluri@gmail.com" method="POST">
    <input type="hidden" name="_cc" value="alban.longchamp@gmail.com,alexanderyyang@gmail.com">
    <input type="hidden" name="_subject" value="Note from organabundance.com">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_next" value="https://www.organabundance.com/thanks">
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
    </div>

    <div class="field">
      <label for="affiliation">Affiliation</label>
      <input type="text" id="affiliation" name="affiliation" autocomplete="organization">
    </div>

    <div class="field">
      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="message">Message <span class="req">*</span></label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn">Send</button>
    </div>
  </form>

  <a class="back-link" href="/">Back to the primer</a>
</div>

</body>
</html>
